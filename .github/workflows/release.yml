name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -r web/dist internal/web/dist
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X github.com/inboxes-cig/bastion/internal/version.Version=${VERSION}" -o bastion ./cmd/bastion
      - name: Package
        run: |
          mkdir -p pkg/systemd
          cp bastion install.sh README.md LICENSE pkg/
          cp systemd/bastion.service pkg/systemd/
          tar -czf "bastion_linux_${{ matrix.goarch }}.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: bastion-linux-${{ matrix.goarch }}
          path: bastion_linux_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
