server:
  http_addr: ":80"
  https_addr: ":443"
  api_addr: ":8080"
database:
  url: "postgres://waf:PASSWORD@localhost:5432/waf?sslmode=disable"
auth:
  jwt_secret: "CHANGE_ME"
  session_secret: "CHANGE_ME"
certs:
